<title>VK SATELLITE // CONTROL</title>
<style>
:root { --bg: #020509; --panel: rgba(5, 13, 20, .78); --panel2: rgba(8, 20, 30, .62); --cyan: #00eaff; --green: #00ff9d; --red: #ff3158; --amber: #ffc857; --text: #c9f7ff; --muted: #6c8d99; --line: rgba(0, 234, 255, .16); --glow: 0 0 28px rgba(0,234,255,.22);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { min-height: 100vh; background: radial-gradient(circle at 70% 20%, rgba(0,234,255,.08), transparent 28%), radial-gradient(circle at 20% 80%, rgba(0,255,157,.05), transparent 30%), var(--bg); color: var(--text); font-family: "Courier New", monospace; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; background: repeating-linear-gradient( 0deg, rgba(255,255,255,.018) 0, rgba(255,255,255,.018) 1px, transparent 1px, transparent 4px ); mix-blend-mode: screen;
}
canvas#space { position: fixed; inset: 0; z-index: -2;
}
#radarCanvas { width: 100%; height: 100%;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: rgba(0, 234, 255, .05); color: var(--cyan); padding: 10px 14px; transition: .2s;
}
button:hover { background: rgba(0,234,255,.14); box-shadow: var(--glow);
}
.boot { position: fixed; inset: 0; background: #000; z-index: 100; display: grid; place-items: center; transition: opacity .8s, visibility .8s;
}
.boot.hide { opacity: 0; visibility: hidden; }
